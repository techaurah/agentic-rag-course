<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420">
<rect width="1180" height="420" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">The RAG pipeline</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Four stages, and the course spends most of its time on the first three</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="150" width="220" height="90" rx="12" fill="#E0F2FE"/>
<text x="150.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Documents</text>
<text x="150.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">the corpus</text>
<rect x="310" y="150" width="220" height="90" rx="12" fill="#0B1F4A"/>
<text x="420.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Chunk and index</text>
<text x="420.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">offline, in advance</text>
<rect x="580" y="150" width="220" height="90" rx="12" fill="#0B1F4A"/>
<text x="690.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Retrieve</text>
<text x="690.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">per question</text>
<rect x="850" y="150" width="290" height="90" rx="12" fill="#E0F2FE"/>
<text x="995.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Answer with citations</text>
<text x="995.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">or refuse, on evidence</text>
<line x1="260" y1="195" x2="310" y2="195" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<line x1="530" y1="195" x2="580" y2="195" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<line x1="800" y1="195" x2="850" y2="195" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="580" y="300" width="220" height="70" rx="12" fill="#FEF3C7"/>
<text x="690.0" y="331.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Golden set</text>
<text x="690.0" y="355.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7C5A03">grades every stage</text>
<line x1="690" y1="300" x2="690" y2="240" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<text x="40" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Generation is the visible stage. Retrieval quality decides whether generation has anything true to say.</text>
</svg>