<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420">
<rect width="1180" height="420" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">The capstone flow</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Spec first, gates fixed, then build, then grade</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="150" width="240" height="90" rx="12" fill="#FEF3C7"/>
<text x="160.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Spec and gates</text>
<text x="160.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7C5A03">Lesson 28</text>
<rect x="330" y="150" width="240" height="90" rx="12" fill="#0B1F4A"/>
<text x="450.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Build the system</text>
<text x="450.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">Lesson 29</text>
<rect x="620" y="150" width="240" height="90" rx="12" fill="#0B1F4A"/>
<text x="740.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Evaluate and harden</text>
<text x="740.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">Lesson 30</text>
<rect x="910" y="150" width="230" height="90" rx="12" fill="#E0F2FE"/>
<text x="1025.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Ship and showcase</text>
<text x="1025.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">Lesson 31</text>
<line x1="280" y1="195" x2="330" y2="195" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<line x1="570" y1="195" x2="620" y2="195" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<line x1="860" y1="195" x2="910" y2="195" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<text x="40" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Gates: recall at 5 at least 0.95, fact recall at 5 at least 0.95, citations 100 percent,</text>
<text x="40" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">refusals at least 5 of 6 with zero false refusals, zero restricted leaks.</text>
<text x="40" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">The reference build's measured results are printed by Lesson 30's harness, not asserted here.</text>
</svg>