<rect x="40" y="170" width="230" height="90" rx="12" fill="#E0F2FE"/>
<text x="155.0" y="211.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Golden set</text>
<text x="155.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">32 fixed questions</text>
<rect x="330" y="170" width="230" height="90" rx="12" fill="#0B1F4A"/>
<text x="445.0" y="211.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Run the system</text>
<text x="445.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">same code path as users</text>
<rect x="620" y="170" width="230" height="90" rx="12" fill="#0B1F4A"/>
<text x="735.0" y="211.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Score</text>
<text x="735.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">recall, facts, refusals</text>
<rect x="910" y="170" width="230" height="90" rx="12" fill="#FEF3C7"/>
<text x="1025.0" y="211.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Decide</text>
<text x="1025.0" y="235.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7C5A03">keep, revert, or fix</text>
