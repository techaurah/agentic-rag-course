<text x="735.0" y="322.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0891B2">change one thing</text>
<line x1="445" y1="330" x2="445" y2="260" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<text x="40" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Lessons 18 to 20 build this loop. Every earlier lesson's claim was produced inside it.</text>
