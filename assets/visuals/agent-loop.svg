<line x1="715" y1="340" x2="715" y2="280" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<text x="40" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Lessons 21 to 24 build this loop piece by piece, and measure what each piece adds.</text>
