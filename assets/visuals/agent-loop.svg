<rect x="40" y="190" width="210" height="90" rx="12" fill="#E0F2FE"/>
<text x="145.0" y="242.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Question</text>
